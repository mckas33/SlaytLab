<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-posta doğrulama — SlaytLab</title>
</head>
<body style="margin:0;padding:0;background:#f6f8fa;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f8fa;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e2e8f0;border-radius:20px;overflow:hidden;">
          <tr>
            <td style="padding:28px 28px 12px;background:#0f2647;color:#ffffff;">
              <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.8;">SlaytLab</div>
              <h1 style="margin:8px 0 0;font-size:22px;font-weight:700;">E-posta adresini doğrula</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px 8px;font-size:15px;line-height:1.6;color:#45505c;">
              Merhaba,<br /><br />
              Hesabını etkinleştirmek için aşağıdaki düğmeye tıkla. Bu bağlantı sınırlı süre için geçerlidir.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:16px 28px 8px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;background:#0d7d78;color:#ffffff;text-decoration:none;border-radius:10px;font-weight:700;font-size:14px;">
                E-postamı doğrula
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 28px;font-size:13px;line-height:1.6;color:#64748b;">
              Düğme çalışmazsa bu bağlantıyı tarayıcına yapıştır:<br />
              <span style="word-break:break-all;color:#0f2647;">{{ .ConfirmationURL }}</span>
              <br /><br />
              Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
